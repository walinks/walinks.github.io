<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t d">
  <title id="t">People joining a WhatsApp group from a phone</title>
  <desc id="d">A phone showing a group chat with message bubbles and member avatars, surrounded by floating chat icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCF8C6"/><stop offset="1" stop-color="#F0FBF4"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#128C7E"/><stop offset="1" stop-color="#25D366"/></linearGradient>
  </defs>
  <rect width="560" height="460" rx="32" fill="url(#bg)"/>
  <circle cx="86" cy="84" r="46" fill="#25D366" opacity=".12"/>
  <circle cx="486" cy="388" r="64" fill="#128C7E" opacity=".10"/>
  <!-- phone -->
  <rect x="170" y="38" width="220" height="384" rx="30" fill="#0D1F17"/>
  <rect x="180" y="52" width="200" height="356" rx="22" fill="#E5DDD5"/>
  <path d="M180 74a22 22 0 0 1 22-22h156a22 22 0 0 1 22 22v32H180z" fill="url(#hd)"/>
  <circle cx="206" cy="86" r="14" fill="#fff"/><circle cx="206" cy="82" r="5" fill="#128C7E"/><path d="M196 96a10 8 0 0 1 20 0z" fill="#128C7E"/>
  <rect x="228" y="76" width="92" height="8" rx="4" fill="#fff"/>
  <rect x="228" y="91" width="64" height="6" rx="3" fill="#fff" opacity=".7"/>
  <!-- bubbles -->
  <rect x="192" y="122" width="132" height="42" rx="12" fill="#fff"/>
  <rect x="202" y="134" width="98" height="6" rx="3" fill="#8DA89E"/><rect x="202" y="147" width="70" height="6" rx="3" fill="#8DA89E" opacity=".6"/>
  <rect x="236" y="176" width="132" height="42" rx="12" fill="#DCF8C6"/>
  <rect x="246" y="188" width="100" height="6" rx="3" fill="#587066"/><rect x="246" y="201" width="60" height="6" rx="3" fill="#587066" opacity=".6"/>
  <rect x="192" y="230" width="112" height="34" rx="12" fill="#fff"/>
  <rect x="202" y="244" width="84" height="6" rx="3" fill="#8DA89E"/>
  <rect x="236" y="276" width="132" height="42" rx="12" fill="#DCF8C6"/>
  <rect x="246" y="288" width="86" height="6" rx="3" fill="#587066"/><rect x="246" y="301" width="104" height="6" rx="3" fill="#587066" opacity=".6"/>
  <!-- join card -->
  <rect x="192" y="332" width="176" height="52" rx="14" fill="#fff"/>
  <rect x="204" y="346" width="76" height="8" rx="4" fill="#0D1F17"/><rect x="204" y="360" width="52" height="6" rx="3" fill="#8DA89E"/>
  <rect x="296" y="344" width="60" height="28" rx="14" fill="#25D366"/>
  <text x="326" y="362" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#fff">Join</text>
  <!-- floating avatars -->
  <g>
    <circle cx="110" cy="190" r="30" fill="#fff"/><circle cx="110" cy="182" r="10" fill="#25D366"/><path d="M92 208a18 14 0 0 1 36 0z" fill="#25D366"/>
    <circle cx="456" cy="140" r="30" fill="#fff"/><circle cx="456" cy="132" r="10" fill="#128C7E"/><path d="M438 158a18 14 0 0 1 36 0z" fill="#128C7E"/>
    <circle cx="450" cy="300" r="26" fill="#fff"/><circle cx="450" cy="293" r="9" fill="#34B7F1"/><path d="M434 319a16 12 0 0 1 32 0z" fill="#34B7F1"/>
    <circle cx="96" cy="320" r="26" fill="#fff"/><circle cx="96" cy="313" r="9" fill="#F5A623"/><path d="M80 339a16 12 0 0 1 32 0z" fill="#F5A623"/>
  </g>
  <!-- chat icon badges -->
  <g>
    <rect x="84" y="108" width="62" height="38" rx="14" fill="#25D366"/><circle cx="104" cy="127" r="3.5" fill="#fff"/><circle cx="115" cy="127" r="3.5" fill="#fff"/><circle cx="126" cy="127" r="3.5" fill="#fff"/>
    <rect x="414" y="214" width="70" height="38" rx="14" fill="#128C7E"/><path d="M436 233l8 8 16-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
